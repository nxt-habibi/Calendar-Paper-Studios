name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Make Project
        run: |
          mkdir -p app/src/main/java/com/paper/calendar
          mkdir -p app/src/main/assets
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.paper.calendar'
            compileSdkVersion 34
            defaultConfig { applicationId "com.paper.calendar"; minSdkVersion 21; targetSdkVersion 34; versionCode 6; versionName "2.2" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.paper.calendar">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
            <application android:label="Calendar">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/paper/calendar/MainActivity.java << 'EOF'
          package com.paper.calendar;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*; import android.content.Intent; import android.net.Uri;
          public class MainActivity extends Activity {
            ValueCallback<Uri[]> cb; final int REQ=1001;
            protected void onCreate(Bundle b){
              super.onCreate(b);
              WebView wv=new WebView(this);
              WebSettings s=wv.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true);
              wv.setWebChromeClient(new WebChromeClient(){
                public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> c, FileChooserParams p){
                  cb=c; Intent i=new Intent(Intent.ACTION_GET_CONTENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("image/*");
                  startActivityForResult(Intent.createChooser(i,"Gallery"),REQ); return true;
                }
              });
              wv.setWebViewClient(new WebViewClient());
              setContentView(wv);
              wv.loadUrl("file:///android_asset/index.html");
            }
            protected void onActivityResult(int rc,int res,Intent d){
              if(rc==REQ && cb!=null){ cb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res,d)); cb=null; }
              super.onActivityResult(rc,res,d);
            }
          }
          EOF
          cp index.html app/src/main/assets/index.html
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Calendar-PRO
          path: app/build/outputs/apk/debug/app-debug.apk
