name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make PRO Project
        run: |
          mkdir -p app/src/main/java/com/paper/calendar
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          cat > app/src/main/java/com/paper/calendar/MainActivity.java << 'EOF'
          package com.paper.calendar;
          import android.app.Activity; import android.os.Bundle; import android.webkit.*;
          import android.content.Intent; import android.net.Uri; import android.webkit.WebChromeClient.FileChooserParams;
          public class MainActivity extends Activity {
            private ValueCallback<Uri[]> filePathCallback;
            private static final int REQ = 1001;
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              wv.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
              wv.setBackgroundColor(0x00000000);
              wv.setWebChromeClient(new WebChromeClient() {
                public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                  filePathCallback = callback;
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("image/*");
                  startActivityForResult(Intent.createChooser(i, "Choose from gallery"), REQ);
                  return true;
                }
              });
              wv.setWebViewClient(new WebViewClient());
              setContentView(wv);
              wv.loadUrl("file:///android_asset/index.html");
            }
            protected void onActivityResult(int rc, int res, Intent data) {
              if(rc==REQ){ if(filePathCallback!=null){ Uri[] r = WebChromeClient.FileChooserParams.parseResult(res, data); filePathCallback.onReceiveValue(r); filePathCallback=null; } }
              super.onActivityResult(rc,res,data);
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.paper.calendar">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
            <application android:label="Calendar" android:allowBackup="true" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.paper.calendar'
            compileSdk 34
            defaultConfig { applicationId "com.paper.calendar"; minSdk 21; targetSdk 34; versionCode 2; versionName "1.1" }
          }
          EOF
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'EOF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cp index.html app/src/main/assets/index.html
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Calendar-Final-PRO
          path: app/build/outputs/apk/debug/app-debug.apk
