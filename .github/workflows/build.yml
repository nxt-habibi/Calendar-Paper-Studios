name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files
        run: |
          unzip -o PaperStudiosCalendar_Android.zip
          # If files were unzipped into a subfolder, move them to the root
          SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            cp -r $SUBDIR/* .
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-Paper-Studios-APK
          path: app/build/outputs/apk/debug/app-debug.apk
