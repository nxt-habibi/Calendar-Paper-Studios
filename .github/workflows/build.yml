name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/paper/calendar
          mkdir -p app/src/main/assets
          cat > app/src/main/java/com/paper/calendar/MainActivity.java << 'EOF'
          package com.paper.calendar;
          import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              WebView wv = new WebView(this);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              setContentView(wv);
              wv.loadUrl("file:///android_asset/index.html");
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.paper.calendar">
            <application android:label="Paper Calendar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application>
          </manifest>
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android { compileSdkVersion 34; defaultConfig { applicationId "com.paper.calendar"; minSdkVersion 21; targetSdkVersion 34; versionCode 1; versionName "1.0" } }
          EOF
          echo "include ':app'" > settings.gradle
          cp index.html app/src/main/assets/index.html
      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PaperCalendar-APK
          path: app/build/outputs/apk/debug/app-debug.apk
