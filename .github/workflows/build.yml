name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract and Flatten Directory
        run: |
          unzip -o PaperStudiosCalendar_Android.zip
          # Find where gradlew is located and move everything from that folder to root
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "./gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            cp -r $DIR/* .
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calendar-Paper-Studios-APK
          path: app/build/outputs/apk/debug/app-debug.apk
